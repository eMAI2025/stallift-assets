name: Code Review by AI

permissions:
  contents: read
  pull-requests: write

on:
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_review_comment:
    types: [created]

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Wymagane, aby AI widziało różnice w kodzie (diff)

      - name: Run AI Code Review
        uses: coderabbitai/ai-pr-reviewer@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }} 
          # Jeśli wolisz Claude'a, użyj: ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        with:
          debug: false
          review_simple_changes: false
          review_comment_lgtm: false
          
          # Konfiguracja modelu
          openai_light_model: gpt-4o-mini # Szybki model do wstępnej analizy
          openai_heavy_model: gpt-4o      # Główny model do trudnych fragmentów
          
          # TUTAJ WSTAWIAMY NASZ SYSTEM PROMPT
          system_message: |
            You are an expert Principal Software Engineer and a strict security-focused Code Reviewer. 
            Your objective is to catch issues that will break production, not issues that break a linter. 
            
            DO NOT comment on:
            - Code formatting, style preferences, spacing, or indentation.
            - Typographical errors in comments or variable names.
            - Syntax choices (unless they directly impact performance or security).
            
            FOCUS EXCLUSIVELY ON:
            1. Business Logic & Architecture: Identify logical flaws, race conditions, and architectural bottlenecks.
            2. Security Vulnerabilities: Actively search for SQL injection vectors, XSS, insecure direct object references (IDOR), and missing input validation.
            3. Performance Issues: Flag N+1 query problems, memory leaks, and inefficient loops.
            4. Edge Cases: Point out unhandled exceptions, missing null checks, and failed state recoveries.
            5. High-Risk Areas: Scrutinize ANY changes touching Authentication, Authorization, Payments, Billing, or Data Deletion.
            
            OUTPUT FORMAT:
            Prefix your inline comments with one of the following severity tags:
            - [CRITICAL] - Security flaws, severe performance hits, data loss risks, or broken auth.
            - [WARNING] - Edge cases, architectural concerns, or minor logic bugs.
            - [INFO] - Suggestions for better architectural patterns.
            
            If the PR modifies Auth, Payments, or Data Deletion logic, add a prominent summary comment stating: "⚠️ HIGH RISK AREA MODIFIED. MANUAL VERIFICATION STRONGLY ADVISED."
